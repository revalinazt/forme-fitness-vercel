<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0e8">
  <title>FORME / Membership &amp; Payment Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-label="FORME logo"><span class="logo-f">F</span><span class="logo-motion"></span></span><div class="brand-copy"><strong>FORME</strong><span class="brand-subbrand">FITNESS &amp; WELLNESS</span><small>Membership &amp; Payment Management</small><span class="brand-tagline">Fitness · Pilates · Yoga · Zumba</span></div></div>
      <div class="workspace-label">MAIN</div>
      <nav class="nav-list" aria-label="Navigasi utama">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">◈</span> Dashboard</button>
        <button class="nav-item" data-view="members"><span class="nav-icon">◎</span> Customers</button>
        <button class="nav-item" data-view="memberships"><span class="nav-icon">◷</span> Memberships</button>
        <button class="nav-item" data-view="payments"><span class="nav-icon">↗</span> Payments</button>
        <button class="nav-item" data-view="plans"><span class="nav-icon">▦</span> Membership Plans</button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">▤</span> Laporan Pendapatan</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sync-card"><span class="status-dot"></span><div><strong>Data tersinkron</strong><small id="connectionLabel">Mode demo aktif</small></div></div>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span> Pengaturan</button>
        <div class="user-chip"><div class="avatar">AD</div><div><strong>Admin Studio</strong><small>Operator keuangan</small></div><span class="more">•••</span></div>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div class="breadcrumb"><span>FORME</span><b>/</b><strong id="pageKicker">DASHBOARD</strong></div><div class="top-actions"><span class="today" id="todayLabel"></span><button class="icon-button" id="refreshButton" title="Segarkan data">↻</button><button class="primary-button" id="quickAddButton">+ Tambah transaksi</button></div></header>
      <section class="page-content" id="appContent"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><div><span class="eyebrow">INPUT DATA</span><h2 id="modalTitle">Tambah transaksi</h2></div><button class="close-button" id="closeModal" type="button">×</button></div><form id="entryForm"></form></div></div>
  <script src="/app.js"></script>
</body>
</html>
